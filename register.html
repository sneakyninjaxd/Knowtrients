<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="topbar-link" href="login.html">Login</a>
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="registerForm" novalidate>
    <h1>Register</h1>
    <p class="auth-sub">Start your Knowtrients journey here!</p>

    <div id="registrationError" class="form-error" style="display:none;"></div>

    <div class="field" id="registerEmailField">
      <label for="registerEmail">Email</label>
      <input class="input" type="email" id="registerEmail" placeholder="example123@gmail.com" required>
      <div class="field-hint">Enter a valid email address.</div>
    </div>

    <div class="field" id="registerFirstNameField">
      <label for="registerFirstName">First Name</label>
      <input class="input" type="text" id="registerFirstName" placeholder="John" required>
      <div class="field-hint">Enter your first name.</div>
    </div>

    <div class="field" id="registerLastNameField">
      <label for="registerLastName">Last Name</label>
      <input class="input" type="text" id="registerLastName" placeholder="Doe" required>
      <div class="field-hint">Enter your last name.</div>
    </div>

    <div class="field" id="registerPasswordField">
      <label for="registerPassword">Password</label>
      <input class="input" type="password" id="registerPassword" placeholder="••••••••••" required>
      <div class="field-hint">Enter your password.</div>
    </div>

    <div class="field" id="registerConfirmPasswordField">
      <label for="registerConfirmPassword">Confirm Password</label>
      <input class="input" type="password" id="registerConfirmPassword" placeholder="••••••••••" required>
      <div class="field-hint">Confirm your password.</div>
    </div>


    <button type="submit" class="btn btn-primary btn-block">Register</button>

    <div class="auth-alt">
      <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
<script>
  const form = document.getElementById("registerForm");
  const submitBtn = form.querySelector("button[type=submit]");
  const errorBox = document.getElementById("registrationError");
  const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const $ = (id) => document.getElementById(id);

  // Already signed in: skip the form and go to wherever this role belongs.
  if (Session.isLoggedIn && homeFor(Session.user?.role)) {
    window.location.href = homeFor(Session.user.role);
  }

  // Clear a field's error as soon as it's edited.
  form.querySelectorAll(".input").forEach((input) => {
    input.addEventListener("input", () => markFieldError(input.closest(".field"), false));
  });

  function validate(){
    const password = $("registerPassword").value;
    const checks = [
      ["registerEmailField", !EMAIL_PATTERN.test($("registerEmail").value.trim())],
      ["registerFirstNameField", !$("registerFirstName").value.trim()],
      ["registerLastNameField", !$("registerLastName").value.trim()],
      // TODO: tighten this if the team agrees on stronger password rules.
      ["registerPasswordField", password.length < 8],
      ["registerConfirmPasswordField", $("registerConfirmPassword").value !== password],
    ];
    checks.forEach(([id, bad]) => markFieldError($(id), bad));
    const firstBad = checks.find(([, bad]) => bad);
    if (firstBad) $(firstBad[0]).querySelector(".input").focus();
    return !firstBad;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.style.display = "none";
    if (!validate()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Creating your account\u2026";

    try {
      // Registering signs the user in, so they land straight on the download
      // page instead of having to log in again.
      const user = await Auth.register({
        first_name: $("registerFirstName").value.trim(),
        last_name: $("registerLastName").value.trim(),
        email: $("registerEmail").value.trim(),
        password: $("registerPassword").value,
      });
      window.location.href = homeFor(user.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Register";
    }
  });
</script>
</body>
</html>
