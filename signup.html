<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="topbar-link" href="index.html#download">Download</a>
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="signupForm" novalidate style="max-width:480px;">
    <h1>Create Account</h1>
    <p class="auth-sub">Enter your details to continue</p>

    <div class="field" id="suTypeField">
      <label for="suType">User Type</label>
      <select class="input" id="suType" required>
        <option value="" disabled selected>Select User Type</option>
        <option value="admin">User Admin</option>
        <option value="manager">Platform Manager</option>
      </select>
      <div class="field-hint">Please select a user type.</div>
    </div>

    <div class="field" id="suEmailField">
      <label for="suEmail">Email</label>
      <input class="input" type="email" id="suEmail" placeholder="example123@gmail.com" required>
      <div class="field-hint">Enter a valid email address.</div>
    </div>

    <div class="field-row">
      <div class="field" id="suFirstField">
        <label for="suFirst">First Name</label>
        <input class="input" type="text" id="suFirst" placeholder="John" required>
        <div class="field-hint">Required.</div>
      </div>
      <div class="field" id="suLastField">
        <label for="suLast">Last Name</label>
        <input class="input" type="text" id="suLast" placeholder="Doe" required>
        <div class="field-hint">Required.</div>
      </div>
    </div>

    <div class="field" id="suPassField">
      <label for="suPass">Password</label>
      <input class="input" type="password" id="suPass" placeholder="••••••••••" required minlength="8">
      <div class="field-hint">Use at least 8 characters.</div>
    </div>

    <div class="field" id="suPass2Field">
      <label for="suPass2">Re-type Password</label>
      <input class="input" type="password" id="suPass2" placeholder="••••••••••" required>
      <div class="field-hint">Passwords do not match.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Create Account</button>

    <p class="auth-foot">Have an Account? <a href="login.html">Login!</a></p>
  </form>
</main>

<script src="js/app.js"></script>
<script>
  document.getElementById("signupForm").addEventListener("submit", function(e){
    e.preventDefault();
    const type = document.getElementById("suType");
    const email = document.getElementById("suEmail");
    const first = document.getElementById("suFirst");
    const last = document.getElementById("suLast");
    const pass = document.getElementById("suPass");
    const pass2 = document.getElementById("suPass2");
    let valid = true;

    markFieldError(document.getElementById("suTypeField"), !type.value); if(!type.value) valid = false;
    markFieldError(document.getElementById("suEmailField"), !email.value); if(!email.value) valid = false;
    markFieldError(document.getElementById("suFirstField"), !first.value); if(!first.value) valid = false;
    markFieldError(document.getElementById("suLastField"), !last.value); if(!last.value) valid = false;
    markFieldError(document.getElementById("suPassField"), pass.value.length < 8); if(pass.value.length < 8) valid = false;
    markFieldError(document.getElementById("suPass2Field"), pass2.value !== pass.value || !pass2.value); if(pass2.value !== pass.value || !pass2.value) valid = false;

    if(!valid) return;

    // Demo only: account creation would normally require approval / go to backend.
    window.location.href = "login.html";
  });
</script>
</body>
</html>
