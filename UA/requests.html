<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requests — Knowtrients Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-topbar">
  <div class="app-topbar-left">
    <button class="hamburger" id="sidebarToggle" aria-label="Toggle menu">☰</button>
    <a class="brand" href="dashboard.html" style="font-size:1.05rem;"><span class="brand-mark" style="width:24px;height:24px;font-size:13px;">✦</span> Knowtrients</a>
  </div>
  <div class="welcome-chip">
    <span class="avatar">👤</span> Welcome, Admin
  </div>
</header>

<aside class="app-sidebar" id="appSidebar">
  <div class="sb-group">
    <h3><a href="accounts.html?type=All">Accounts</a></h3>
    <ul>
      <li><a href="accounts.html?type=User%20Admin">User Admins</a></li>
      <li><a href="accounts.html?type=User">Users</a></li>
      <li><a href="accounts.html?type=Platform%20Manager">Platform Managers</a></li>
    </ul>
  </div>
  <div class="sb-group">
    <li><h3><a href="requests.html?filter=All">Requests</a></h3></li>
    <ul>
      <li><a href="requests.html?filter=Unresolved">Pending Requests</a></li>
      <li><a href="requests.html?filter=Resolved">Resolved Requests</a></li>
    </ul>
  </div>
</aside>

<main class="app-main" id="appMain">
  <div class="page-head">
    <h1>Requests</h1>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label for="typeFilter">User Type:</label>
      <select class="input select-compact" id="typeFilter">
        <option value="All" default>All</option>
        <option value="Unresolved">Unresolved</option>
        <option value="Resolved">Resolved</option>
      </select>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input class="input" id="searchInput" placeholder="Search user…">
    </div>
  </div>

  <div class="data-table">
    <table>
      <thead>
        <tr>
          <th>Time</th><th>Request ID</th><th>User ID</th><th>Name</th><th>Email</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="requestsBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-hint" style="display:none;">No requests match your search.</div>
</main>

<script src="../js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="../js/mock-api.js"></script>
<script src="../js/app.js"></script>

<script>
  requireAuth();

  const params = new URLSearchParams(window.location.search);
  const initialFilter = params.get("filter") || "All";
  const typeFilter = document.getElementById("typeFilter");
  const searchInput = document.getElementById("searchInput");
  const body = document.getElementById("requestsBody");
  const emptyState = document.getElementById("emptyState");

  typeFilter.value = initialFilter;

  function showRow(text, isError){
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;${
      isError ? "color:var(--danger);" : "color:var(--muted);"
    }">${escapeHtml(text)}</td></tr>`;
    emptyState.style.display = "none";
  }

  async function render(){
    showRow("Loading requests…", false);
    try {
      const rows = await Requests.list({
        status: typeFilter.value,
        q: searchInput.value.trim(),
      });

      body.innerHTML = "";
      rows.forEach(r => {
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.addEventListener("click", () =>
          window.location.href = "request-detail.html?id=" + r.id);
        tr.innerHTML = `
          <td>${escapeHtml(formatDateTime(r.created_at))}</td>
          <td class="mono-id">${escapeHtml(r.display_id || r.id)}</td>
          <td class="mono-id">${escapeHtml(r.user_display_id || r.user_id)}</td>
          <td>${escapeHtml(r.user_name || "—")}</td>
          <td class="email-cell">${escapeHtml(r.user_email || "—")}</td>
          <td><span class="status-dot status-${r.status}">${statusLabel(r.status)}</span></td>
        `;
        body.appendChild(tr);
      });

      emptyState.style.display = rows.length ? "none" : "block";
    } catch (err) {
      showRow(err.message, true);
    }
  }

  let searchTimer;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 300);
  });

  typeFilter.addEventListener("change", () => {
    const url = new URL(window.location);
    url.searchParams.set("filter", typeFilter.value);
    window.history.replaceState({}, "", url);
    render();
  });

  render();
</script>
</body>
</html>
