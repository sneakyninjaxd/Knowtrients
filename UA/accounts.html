<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts — Knowtrients Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-topbar">
  <button class="brand" id="brandTrigger" aria-label="Open menu">
    <span class="brand-mark">✦</span> Knowtrients
  </button>
  <div class="avatar-chip">
    <a class="welcome-chip" href="my-account.html" title="My Account">
      <span class="avatar">👤 </span> Welcome, Admin
    </a>
    <button class="logout-btn" type="button">Logout</button>
  </div>
  
</header>

<div class="drawer-scrim" id="drawerScrim"></div>
<nav class="drawer" id="drawer" aria-label="Site navigation">
  <div class="drawer-section">
    <a href="dashboard.html?type=All"><h2>Home</h2></a>
  </div>
  <div class="drawer-section">
    <a href="accounts.html?type=All"><h3>Accounts</h3></a>
    <ul>
      <li><a href="accounts.html?type=User%20Admin">User Admins</a></li>
      <li><a href="accounts.html?type=User">Users</a></li>
      <li><a href="accounts.html?type=Platform%20Manager">Platform Managers</a></li>
    </ul>
  </div>
  <div class="drawer-section">
    <a href="requests.html?filter=All"><h3>Requests</h3></a>
    <ul>
      <li><a href="requests.html?filter=Unresolved">Pending Requests</a></li>
      <li><a href="requests.html?filter=Resolved">Resolved Requests</a></li>
    </ul>
  </div>
</nav>

<main class="app-main" id="appMain">
  <div class="page-head">
    <h1>Accounts</h1>
    <a class="btn btn-primary" href="create-account.html">+ Create Account</a>

  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label for="typeFilter">User Type:</label>
      <select class="input select-compact" id="typeFilter">
        <option value="All" default>All</option>
        <option value="User Admin">User Admin</option>
        <option value="User">User</option>
        <option value="Platform Manager">Platform Manager</option>
      </select>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input class="input" id="searchInput" placeholder="Search user…">
    </div>
  </div>

  <div class="data-table">
    <table>
      <thead>
        <tr>
          <th>User ID</th><th>First Name</th><th>Last Name</th><th>Email</th><th>User Type</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="accountsBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-hint" style="display:none;">No accounts match your search.</div>
</main>

<script src="../js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="../js/mock-api.js"></script>
<script src="../js/app.js"></script>

<script>
  requireRole("user_admin");

  const params = new URLSearchParams(window.location.search);
  const initialType = params.get("type") || "All";
  const typeFilter = document.getElementById("typeFilter");
  const searchInput = document.getElementById("searchInput");
  const body = document.getElementById("accountsBody");
  const emptyState = document.getElementById("emptyState");

  typeFilter.value = initialType;

  document.querySelectorAll('.sb-group a[data-type]').forEach(a => {
    if (a.dataset.type === initialType) a.classList.add("active");
  });

  function showRow(text, isError){
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:24px;${
      isError ? "color:var(--danger);" : "color:var(--muted);"
    }">${escapeHtml(text)}</td></tr>`;
    emptyState.style.display = "none";
  }

  async function render(){
    showRow("Loading accounts…", false);
    try {
      const rows = await Accounts.list({ 
        userType: typeFilter.value,
        q: searchInput.value.trim(),
      });

      body.innerHTML = "";
      rows.forEach(a => {
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.addEventListener("click", () =>
          window.location.href = "view-account.html?id=" + a.id);
        tr.innerHTML = `
          <td class="mono-id">${escapeHtml(a.display_id || a.id)}</td>
          <td>${escapeHtml(a.first_name)}</td>
          <td>${escapeHtml(a.last_name)}</td>
          <td class="email-cell">${escapeHtml(a.email)}</td>
          <td>${escapeHtml(a.user_type)}</td>
          <td><span class="status-dot status-${a.status.toLowerCase()}">${a.status}</span></td>
        `;
        body.appendChild(tr);
      });

      emptyState.style.display = rows.length ? "none" : "block";
    } catch (err) {
      showRow(err.message, true);
    }
  }

  // Debounced so typing doesn't fire a request per keystroke.
  let searchTimer;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 300);
  });

  typeFilter.addEventListener("change", () => {
    const url = new URL(window.location);
    url.searchParams.set("type", typeFilter.value);
    window.history.replaceState({}, "", url);
    render();
  });

  render();
</script>
</body>
</html>
