<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Code — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="codeForm" novalidate>
    <h1>Enter Code</h1>
    <p class="auth-sub" id="sentTo">We've sent a 6-digit code to your email.</p>

    <div id="formError" class="form-error" style="display:none;"></div>

    <div class="field" id="codeField">
      <label for="code">6-digit code</label>
      <input class="input code-input" id="code" inputmode="numeric" maxlength="6"
             autocomplete="one-time-code" placeholder="000000" required>
      <div class="field-hint">Enter the 6 digits from your email.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Verify</button>

    <div class="auth-alt">
      <p>Didn't get it? <a href="forgot-password.html">Send another code</a></p>
      <p><a href="login.html" id="backLink">Back to login</a></p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<!-- Mock backend: comment the next line to use the real API -->
<!-- <script src="js/mock-api.js"></script> -->
<script src="js/app.js"></script>
<script>
  /* The three reset pages hand each other the email and, later, the reset
     token through sessionStorage: short-lived, and nothing sensitive ends up
     in the address bar where it could be shared or logged. "backTo" remembers
     which login page the visitor came from. */
  const RESET_KEY = "knowtrients_reset";

  function resetState(){
    try { return JSON.parse(sessionStorage.getItem(RESET_KEY)) || {}; }
    catch { return {}; }
  }
  function saveResetState(patch){
    sessionStorage.setItem(RESET_KEY, JSON.stringify({ ...resetState(), ...patch }));
  }
  function clearResetState(){ sessionStorage.removeItem(RESET_KEY); }

  /** Where to send people when they finish or cancel. */
  function loginPage(){
    return resetState().backTo === "admin" ? "UAlogin.html" : "login.html";
  }

  const $ = (id) => document.getElementById(id);
  const state = resetState();

  // Reached directly, with no email to verify against: start over.
  if (!state.email) window.location.replace("forgot-password.html");

  $("sentTo").textContent = `We've sent a 6-digit code to ${state.email}.`;
  $("backLink").href = loginPage();

  // Digits only, so a pasted code with spaces or dashes still works.
  $("code").addEventListener("input", () => {
    $("code").value = $("code").value.replace(/\D/g, "").slice(0, 6);
    markFieldError($("codeField"), false);
  });

  $("codeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("formError").style.display = "none";

    const code = $("code").value.trim();
    markFieldError($("codeField"), !/^\d{6}$/.test(code));
    if (!/^\d{6}$/.test(code)) return;

    const btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Checking…";

    try {
      const res = await Auth.verifyCode(state.email, code, state.role || null);
      saveResetState({ token: res.token });
      window.location.href = "reset-password.html";
    } catch (err) {
      $("formError").textContent = err.message;
      $("formError").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Verify";
    }
  });
</script>
</body>
</html>
