<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Password — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="passwordForm" novalidate>
    <h1>New Password</h1>
    <p class="auth-sub">Choose a new password for your account.</p>

    <div id="formError" class="form-error" style="display:none;"></div>

    <div class="field" id="passwordField">
      <label for="password">New password</label>
      <input class="input" type="password" id="password" placeholder="••••••••••"
             autocomplete="new-password" required>
      <div class="field-hint">At least 8 characters.</div>
    </div>

    <div class="field" id="confirmField">
      <label for="confirmPassword">Confirm new password</label>
      <input class="input" type="password" id="confirmPassword" placeholder="••••••••••"
             autocomplete="new-password" required>
      <div class="field-hint">Passwords do not match.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Change Password</button>

    <div class="auth-alt">
      <p><a href="login.html" id="backLink">Back to login</a></p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<!-- Mock backend: comment the next line to use the real API -->
<!-- <script src="js/mock-api.js"></script> -->
<script src="js/app.js"></script>

<script>
  /* The three reset pages hand each other the email and, later, the reset
     token through sessionStorage: short-lived, and nothing sensitive ends up
     in the address bar where it could be shared or logged. "backTo" remembers
     which login page the visitor came from. */
  const RESET_KEY = "knowtrients_reset";

  function resetState(){
    try { return JSON.parse(sessionStorage.getItem(RESET_KEY)) || {}; }
    catch { return {}; }
  }
  function clearResetState(){ sessionStorage.removeItem(RESET_KEY); }

  /** Where to send people when they finish or cancel. */
  function loginPage(){
    return resetState().backTo === "admin" ? "UAlogin.html" : "login.html";
  }

  const $ = (id) => document.getElementById(id);
  const state = resetState();

  // No verified code, no reset: send them back to the start.
  if (!state.token) window.location.replace("forgot-password.html");

  $("backLink").href = loginPage();

  document.querySelectorAll(".input").forEach((input) => {
    input.addEventListener("input", () => markFieldError(input.closest(".field"), false));
  });

  $("passwordForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("formError").style.display = "none";

    const password = $("password").value;
    const confirmValue = $("confirmPassword").value;
    const checks = [
      ["passwordField", password.length < 8],
      ["confirmField", confirmValue !== password],
    ];
    checks.forEach(([id, bad]) => markFieldError($(id), bad));
    const firstBad = checks.find(([, bad]) => bad);
    if (firstBad) { $(firstBad[0]).querySelector(".input").focus(); return; }

    const btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Saving…";

    try {
      // Replaces the stored password; the old one stops working straight away.
      await Auth.resetPassword(state.token, password);
      const next = loginPage();
      clearResetState();
      showToast("Password changed. Please log in.");
      setTimeout(() => { window.location.href = next; }, 1200);
    } catch (err) {
      $("formError").textContent = err.message;
      $("formError").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Change Password";
    }
  });
</script>
</body>
</html>
