<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request Details — Knowtrients Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-topbar">
  <button class="brand" id="brandTrigger" aria-label="Open menu">
    <span class="brand-mark">✦</span> Knowtrients
  </button>
  <div class="avatar-chip">
    <a class="welcome-chip" href="my-account.html" title="My Account">
      <span class="avatar">👤 </span> Welcome, Admin
    </a>
    <button class="logout-btn" type="button">Logout</button>
  </div>
  
</header>

<div class="drawer-scrim" id="drawerScrim"></div>
<nav class="drawer" id="drawer" aria-label="Site navigation">
  <div class="drawer-section">
    <a href="dashboard.html?type=All"><h2>Home</h2></a>
  </div>
  <div class="drawer-section">
    <a href="accounts.html?type=All"><h3>Accounts</h3></a>
    <ul>
      <li><a href="accounts.html?type=Account%20Administrator">Account Administrators</a></li>
      <li><a href="accounts.html?type=User">Users</a></li>
      <li><a href="accounts.html?type=Platform%20Administrator">Platform Administrators</a></li>
    </ul>
  </div>
  <div class="drawer-section">
    <a href="requests.html?filter=All"><h3>Requests</h3></a>
    <ul>
      <li><a href="requests.html?filter=Unresolved">Pending Requests</a></li>
      <li><a href="requests.html?filter=Resolved">Resolved Requests</a></li>
    </ul>
  </div>
</nav>


<main class="app-main" id="appMain">
  <div class="page-head">
    <div>
      <a class="btn btn-ghost btn-sm" href="requests.html?filter=All">‹ Back to Requests</a>
      <h1 id="requestSubject" style="margin-top:12px;">Loading…</h1>
    </div>
  </div>

  <div id="pageError" class="form-error" style="display:none;"></div>

  <div id="requestContent" style="display:none;">
    <div class="card" style="margin-bottom:24px;">
      <div class="kv-grid" id="requestMeta"></div>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <div class="flex-between" style="margin-bottom:14px;">
        <div class="thread-head">
          <h2 class="mt-0">Conversation</h2>
          <span class="awaiting-chip" id="awaitingChip" style="display:none;">Awaiting your reply</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="refreshBtn" type="button">Refresh</button>
      </div>
      <div class="thread" id="thread"></div>
    </div>

    <div class="card" id="replyCard">
      <h2>Reply</h2>
      <textarea class="reply-box" id="replyBody"
        placeholder="Write your response to the user…"></textarea>
      <div class="detail-actions">
        <button class="btn btn-primary" id="sendResolveBtn">Send &amp; Resolve</button>
        <button class="btn btn-outline" id="sendOnlyBtn">Send Without Resolving</button>
        <button class="btn btn-ghost" id="toggleStatusBtn"></button>
      </div>
    </div>
  </div>
</main>

<script src="../js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="../js/app.js"></script>

<script>
  requireRole("account_administrator");

  const requestId = new URLSearchParams(window.location.search).get("id");
  const subjectEl = document.getElementById("requestSubject");
  const errorEl = document.getElementById("pageError");
  const contentEl = document.getElementById("requestContent");

  let request = null;

  function showError(message){
    errorEl.textContent = message;
    errorEl.style.display = "block";
    subjectEl.textContent = "Request";
  }

  function kv(label, value){
    return `<div class="kv-item">
      <div class="kv-label">${escapeHtml(label)}</div>
      <div class="kv-value">${escapeHtml(value ?? "—")}</div>
    </div>`;
  }

  let messages = [];

  function render(){
    subjectEl.textContent = request.subject;
    contentEl.style.display = "block";

    document.getElementById("requestMeta").innerHTML = [
      kv("Request ID", request.display_id),
      `<div class="kv-item"><div class="kv-label">From</div>
        <div class="kv-value">
          <a href="view-account.html?id=${request.user_id}" style="color:var(--mint);">
            ${escapeHtml(request.user_name || "Unknown")}
          </a>
        </div></div>`,
      kv("Email", request.user_email),
      kv("Category", categoryLabel(request.category)),
      `<div class="kv-item"><div class="kv-label">Status</div>
        <div class="kv-value"><span class="status-dot status-${request.status}">
          ${statusLabel(request.status)}</span></div></div>`,
      kv("Received", formatDateTime(request.created_at)),
    ].join("");

    // The whole conversation, not just the first message and one reply, so a
    // follow-up the user sends after being answered is visible here.
    renderThread(document.getElementById("thread"), request, messages);
    document.getElementById("awaitingChip").style.display =
      awaitingReply(messages) && request.status !== "resolved" ? "inline-block" : "none";

    document.getElementById("toggleStatusBtn").textContent =
      request.status === "resolved" ? "Reopen Request" : "Mark Resolved";
  }

  /** Pulls the request and its messages together. */
  async function fetchAll(){
    request = await Requests.get(requestId);
    // A server that already embeds the thread saves a second round trip.
    messages = Array.isArray(request.messages)
      ? request.messages
      : await Requests.messages(request.id);
  }

  async function send(resolve){
    const body = document.getElementById("replyBody").value.trim();
    if(!body){ alert("Write a reply before sending."); return; }

    const buttons = document.querySelectorAll("#replyCard button");
    buttons.forEach(b => b.disabled = true);

    try {
      await Requests.sendMessage(request.id, body, resolve);
      document.getElementById("replyBody").value = "";
      await fetchAll();
      render();
      showToast(resolve ? "Reply sent and request resolved." : "Reply sent.");
    } catch (err) {
      alert(err.message);
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }

  async function toggleStatus(){
    const next = request.status === "resolved" ? "unresolved" : "resolved";
    const buttons = document.querySelectorAll("#replyCard button");
    buttons.forEach(b => b.disabled = true);

    try {
      request = await Requests.setStatus(request.id, next);
      render();
      showToast(next === "resolved" ? "Request resolved." : "Request reopened.");
    } catch (err) {
      alert(err.message);
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }

  /** Re-reads the conversation so a new message from the user shows up. */
  async function refresh(){
    const btn = document.getElementById("refreshBtn");
    btn.disabled = true;
    try {
      await fetchAll();
      render();
    } catch (err) {
      showError(err.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function load(){
    if(!requestId){ showError("No request specified."); return; }
    try {
      await fetchAll();
      render();
      document.getElementById("sendResolveBtn")
        .addEventListener("click", () => send(true));
      document.getElementById("sendOnlyBtn")
        .addEventListener("click", () => send(false));
      document.getElementById("toggleStatusBtn")
        .addEventListener("click", toggleStatus);
      document.getElementById("refreshBtn")
        .addEventListener("click", refresh);

      // Check for new messages while the page is open, but only while the tab
      // is in front, so a forgotten tab isn't polling all day.
      setInterval(() => { if(!document.hidden) refresh(); }, 30000);
    } catch (err) {
      showError(err.message);
    }
  }

  load();
</script>
</body>
</html>
