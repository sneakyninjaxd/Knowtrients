<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="topbar-link" href="index.html#download">Download</a>
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="loginForm" novalidate>
    <h1>Welcome!</h1>
    <p class="auth-sub">This login page is only for authorized users.</p>

    <div id="loginError" class="form-error" style="display:none;"></div>

    <div class="field" id="loginEmailField">
      <label for="loginEmail">Email</label>
      <input class="input" type="email" id="loginEmail" placeholder="example123@gmail.com" required>
      <div class="field-hint">Enter a valid email address.</div>
    </div>

    <div class="field" id="loginPasswordField">
      <label for="loginPassword">Password</label>
      <input class="input" type="password" id="loginPassword" placeholder="••••••••••" required>
      <div class="field-hint">Enter your password.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Login</button>

  </form>
</main>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  const form = document.getElementById("loginForm");
  const submitBtn = form.querySelector("button[type=submit]");
  const errorBox = document.getElementById("loginError");

  // Already signed in — skip the form.
  if (Session.isLoggedIn) window.location.href = "UA/dashboard.html";

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    errorBox.style.display = "none";

    const email = document.getElementById("loginEmail");
    const password = document.getElementById("loginPassword");
    let valid = true;

    markFieldError(document.getElementById("loginEmailField"), !email.value);
    if(!email.value) valid = false;
    markFieldError(document.getElementById("loginPasswordField"), !password.value);
    if(!password.value) valid = false;
    if(!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    try {
      await Auth.login(email.value.trim(), password.value);
      window.location.href = "UA/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
</script>

<!-- Connects to mock-api.js. Comment this line out to use the real API -->
<script src="js/api.js"></script>
<script src="js/mock-api.js"></script>     


</body>
</html>
