<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="topbar-link" href="register.html">Register</a>
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="loginForm" novalidate>
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to download the Knowtrients app.</p>

    <div id="loginError" class="form-error" style="display:none;"></div>

    <div class="field" id="loginEmailField">
      <label for="loginEmail">Email</label>
      <input class="input" type="email" id="loginEmail" placeholder="example123@gmail.com"
             autocomplete="email" required>
      <div class="field-hint">Enter a valid email address.</div>
    </div>

    <div class="field" id="loginPasswordField">
      <label for="loginPassword">Password</label>
      <input class="input" type="password" id="loginPassword" placeholder="••••••••••"
             autocomplete="current-password" required>
      <div class="field-hint">Enter your password.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Login</button>

    <div class="auth-alt">
      <p>New to Knowtrients? <a href="register.html">Register here</a></p>
      <!-- Staff door. Keep it quiet but findable; the backend decides who
           actually gets in, so this link gives nothing away. -->
      <p>Admin? <a href="UAlogin.html">Sign in here</a></p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
<script>
  // This door is for app users. Admins are turned away with a pointer to
  // UAlogin.html — change this list if that ever needs to open up.
  const ALLOWED_ROLES = ["user"];

  const form = document.getElementById("loginForm");
  const submitBtn = form.querySelector("button[type=submit]");
  const errorBox = document.getElementById("loginError");
  const $ = (id) => document.getElementById(id);

  // No "already signed in" shortcut: opening a login or register page always
  // shows the form, so nobody is carried into an account they didn't just
  // sign in to.

  form.querySelectorAll(".input").forEach((input) => {
    input.addEventListener("input", () => markFieldError(input.closest(".field"), false));
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    errorBox.style.display = "none";

    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;
    markFieldError($("loginEmailField"), !email);
    markFieldError($("loginPasswordField"), !password);
    if (!email || !password) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    try {
      const user = await Auth.loginAs(ALLOWED_ROLES, email, password);
      window.location.href = homeFor(user.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
</script>
</body>
</html>
