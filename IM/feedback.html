<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — Knowtrients IT Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="app-topbar">
  <button class="brand" id="brandTrigger" aria-label="Open menu">
    <span class="brand-mark">✦</span> Knowtrients
  </button>
  <div class="avatar-chip">
    <a class="welcome-chip" href="../IM/my-account.html" title="My Account">
      <span class="avatar">👤</span> Welcome, Admin
    </a>
    <button class="logout-btn" type="button">Logout</button>
  </div>
</header>

<div class="drawer-scrim" id="drawerScrim"></div>
<nav class="drawer" id="drawer" aria-label="Site navigation">
  <div class="drawer-section">
    <a href="dashboard.html"><h2>Home</h2></a>
  </div>
  <div class="drawer-section">
    <a href="analytics.html"><h3>Data Analytics</h3></a>
    <ul>
      <li><a href="analytics.html#performance">Performance Metrics</a></li>
      <li><a href="analytics.html#accuracy">Accuracy Metrics</a></li>
    </ul>
  </div>
  <div class="drawer-section">
    <a href="feedback.html?filter=All"><h3>Feedback</h3></a>
    <ul>
      <li><a href="feedback.html?filter=Unresolved">Feedback Received</a></li>
      <li><a href="feedback.html?filter=Resolved">Resolved Feedback</a></li>
    </ul>
  </div>
</nav>

<main class="app-main" id="appMain">
  <div class="page-head">
    <h1>Feedback</h1>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label for="statusFilter">Filter:</label>
      <select class="input select-compact" id="statusFilter">
        <option value="All">All Feedback</option>
        <option value="Unresolved">Unresolved</option>
        <option value="Resolved">Resolved</option>
      </select>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input class="input" id="searchInput" placeholder="Search">
    </div>
  </div>

  <div class="data-table">
    <table>
      <thead>
        <tr>
          <th>Date</th><th>Feedback ID</th><th>User ID</th><th>Name</th><th>Subject</th><th>Type</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="feedbackBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-hint" style="display:none;">No feedback matches your search.</div>
</main>

<script src="../js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="../js/mock-api.js"></script>
<script src="../js/chart.js"></script>
<script src="../js/app.js"></script>
<script>
  requireRole("IT_manager");

  const params = new URLSearchParams(window.location.search);
  const statusFilter = document.getElementById("statusFilter");
  const searchInput = document.getElementById("searchInput");
  const body = document.getElementById("feedbackBody");
  const emptyState = document.getElementById("emptyState");

  statusFilter.value = params.get("filter") || "All";

  function showRow(text, isError){
    body.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px;${
      isError ? "color:var(--danger);" : "color:var(--muted);"
    }">${escapeHtml(text)}</td></tr>`;
    emptyState.style.display = "none";
  }

  async function render(){
    showRow("Loading feedback\u2026", false);
    try {
      const rows = await Feedback.list({
        status: statusFilter.value,
        q: searchInput.value.trim(),
      });

      body.innerHTML = "";
      rows.forEach(f => {
        const tr = document.createElement("tr");
        tr.style.cursor = "pointer";
        tr.addEventListener("click", () =>
          window.location.href = "feedback-detail.html?id=" + f.id);
        tr.innerHTML = `
          <td>${escapeHtml(formatDateTime(f.created_at))}</td>
          <td class="mono-id">${escapeHtml(f.display_id)}</td>
          <td class="mono-id">${escapeHtml(f.user_display_id || f.user_id)}</td>
          <td>${escapeHtml(f.user_name || "\u2014")}</td>
          <td>${escapeHtml(f.subject)}</td>
          <td>${escapeHtml(feedbackLabel(f.category))}</td>
          <td><span class="status-dot status-${f.status}">${statusLabel(f.status)}</span></td>
        `;
        body.appendChild(tr);
      });

      emptyState.style.display = rows.length ? "none" : "block";
    } catch (err) {
      showRow(err.message, true);
    }
  }

  // Debounced so typing doesn't fire a request per keystroke.
  let searchTimer;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 300);
  });

  statusFilter.addEventListener("change", () => {
    const url = new URL(window.location);
    url.searchParams.set("filter", statusFilter.value);
    window.history.replaceState({}, "", url);
    render();
  });

  render();
</script>
</body>
</html>
