<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="media/favicon.svg" type="image/svg+xml">
<link rel="icon" href="media/favicon.ico" sizes="32x32">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="emailForm" novalidate>
    <h1>Forgot Password</h1>
    <p class="auth-sub">Enter your email and we'll send you a 6-digit code.</p>

    <div id="formError" class="form-error" style="display:none;"></div>

    <!-- Administrators also pick their admin type, so the code can't be used
         against an account of the other type. Hidden for app users. -->
    <div class="field" id="typeField" style="display:none;">
      <label for="adminType">Admin type</label>
      <select class="input" id="adminType">
        <option value="" selected disabled>Select an admin type</option>
        <option value="account_administrator">Account Administrator</option>
        <option value="platform_administrator">Platform Administrator</option>
      </select>
      <div class="field-hint">Choose the type of admin account you are resetting.</div>
    </div>

    <div class="field" id="emailField">
      <label for="email">Email</label>
      <input class="input" type="email" id="email" placeholder="example123@gmail.com"
             autocomplete="email" required>
      <div class="field-hint">Enter a valid email address.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send Code</button>

    <div class="auth-alt">
      <p>Remembered it? <a href="login.html" id="backLink">Back to login</a></p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<!-- Mock backend: comment the next line to use the real API -->
<!-- <script src="js/mock-api.js"></script> -->
<script src="js/app.js"></script>

<script>
  /* The three reset pages hand each other the email and, later, the reset
     token through sessionStorage: short-lived, and nothing sensitive ends up
     in the address bar where it could be shared or logged. "backTo" remembers
     which login page the visitor came from. */
  const RESET_KEY = "knowtrients_reset";

  function resetState(){
    try { return JSON.parse(sessionStorage.getItem(RESET_KEY)) || {}; }
    catch { return {}; }
  }
  function saveResetState(patch){
    sessionStorage.setItem(RESET_KEY, JSON.stringify({ ...resetState(), ...patch }));
  }
  function clearResetState(){ sessionStorage.removeItem(RESET_KEY); }

  /** Where to send people when they finish or cancel. */
  function loginPage(){
    return resetState().backTo === "admin" ? "UAlogin.html" : "login.html";
  }

  const $ = (id) => document.getElementById(id);
  const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // login.html and UAlogin.html link here with ?for=user or ?for=admin.
  const from = new URLSearchParams(window.location.search).get("for");
  if (from === "admin" || from === "user") saveResetState({ backTo: from });
  $("backLink").href = loginPage();

  const isAdmin = resetState().backTo === "admin";
  const ADMIN_ROLES = ["account_administrator", "platform_administrator"];
  if (isAdmin) {
    $("typeField").style.display = "";
    document.querySelector("h1").textContent = "Admin Password Reset";
    document.querySelector(".auth-sub").textContent =
      "Pick your admin type and enter your email, and we'll send you a 6-digit code.";
  }

  $("email").addEventListener("input", () => markFieldError($("emailField"), false));
  $("adminType").addEventListener("change", () => markFieldError($("typeField"), false));

  $("emailForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("formError").style.display = "none";

    const email = $("email").value.trim();
    const role = isAdmin ? $("adminType").value : null;

    markFieldError($("emailField"), !EMAIL_PATTERN.test(email));
    if (isAdmin) markFieldError($("typeField"), !ADMIN_ROLES.includes(role));
    if (!EMAIL_PATTERN.test(email) || (isAdmin && !ADMIN_ROLES.includes(role))) return;

    const btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      await Auth.requestReset(email, role);
      saveResetState({ email, role });
      window.location.href = "verify-code.html";
    } catch (err) {
      $("formError").textContent = err.message;
      $("formError").style.display = "block";
      btn.disabled = false;
      btn.textContent = "Send Code";
    }
  });
</script>
</body>
</html>
