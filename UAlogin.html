<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Knowtrients</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html"><span class="brand-mark">✦</span> Knowtrients</a>
  <div class="topbar-right">
    <a class="pill-login" href="index.html">Back to Home</a>
  </div>
</header>

<main class="auth-wrap">
  <form class="auth-card" id="loginForm" novalidate>
    <h1>Admin Login</h1>
    <p class="auth-sub">For Account Managers and IT Managers.</p>

    <div id="loginError" class="form-error" style="display:none;"></div>

    <div class="field" id="loginTypeField">
      <label for="loginType">Admin type</label>
      <!-- Values are the role slugs the database uses, so no translation is
           needed when the choice is checked against the account. -->
      <select class="input" id="loginType" required>
        <option value="" selected disabled>Select an admin type</option>
        <option value="account_manager">Account Manager</option>
        <option value="IT_manager">IT Manager</option>
      </select>
      <div class="field-hint">Choose the type of admin account you are signing in with.</div>
    </div>

    <div class="field" id="loginEmailField">
      <label for="loginEmail">Email</label>
      <input class="input" type="email" id="loginEmail" placeholder="example123@gmail.com"
             autocomplete="email" required>
      <div class="field-hint">Enter a valid email address.</div>
    </div>

    <div class="field" id="loginPasswordField">
      <label for="loginPassword">Password</label>
      <input class="input" type="password" id="loginPassword" placeholder="••••••••••"
             autocomplete="current-password" required>
      <div class="field-hint">Enter your password.</div>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Login</button>

    <div class="auth-alt">
      <p>Each admin type lands on its own dashboard after signing in.</p>
      <p>Not an admin? <a href="login.html">Use the main login</a></p>
    </div>
  </form>
</main>

<script src="js/api.js"></script>
<!-- Mock backend: delete the next line to use the real API -->
<script src="js/mock-api.js"></script>
<script src="js/app.js"></script>
<script>
  // Only admin accounts get in here. The admin type picked below narrows that
  // to one role, so an Account Manager choosing "IT Manager" is refused.
  const STAFF_ROLES = ["account_manager", "IT_manager"];

  const form = document.getElementById("loginForm");
  const submitBtn = form.querySelector("button[type=submit]");
  const errorBox = document.getElementById("loginError");
  const $ = (id) => document.getElementById(id);

  // Already signed in: skip the form and go wherever this role belongs.
  if (Session.isLoggedIn && homeFor(Session.user?.role)) {
    window.location.href = homeFor(Session.user.role);
  }

  form.querySelectorAll(".input").forEach((input) => {
    const clear = () => markFieldError(input.closest(".field"), false);
    input.addEventListener("input", clear);
    input.addEventListener("change", clear);
  });

  form.addEventListener("submit", async function(e){
    e.preventDefault();
    errorBox.style.display = "none";

    const adminType = $("loginType").value;
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    markFieldError($("loginTypeField"), !STAFF_ROLES.includes(adminType));
    markFieldError($("loginEmailField"), !email);
    markFieldError($("loginPasswordField"), !password);
    if (!STAFF_ROLES.includes(adminType) || !email || !password) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in…";

    try {
      // Passing the one chosen role means loginAs checks the account really is
      // that type before keeping the session.
      const user = await Auth.loginAs([adminType], email, password);
      window.location.href = homeFor(user.role);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
</script>
</body>
</html>
