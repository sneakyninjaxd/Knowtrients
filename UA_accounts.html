<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accounts — Knowtrients Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-topbar">
  <div class="app-topbar-left">
    <button class="hamburger" id="sidebarToggle" aria-label="Toggle menu">☰</button>
    <a class="brand" href="dashboard.html" style="font-size:1.05rem;"><span class="brand-mark" style="width:24px;height:24px;font-size:13px;">✦</span> Knowtrients</a>
  </div>
  <div class="welcome-chip">
    <span class="avatar">👤</span> Welcome, Admin
  </div>
</header>

<aside class="app-sidebar" id="appSidebar">
  <div class="sb-group">
    <h3>Accounts</h3>
    <ul>
      <li><a href="accounts.html?type=User%20Admin" data-type="User Admin">User Admins</a></li>
      <li><a href="accounts.html?type=User" data-type="User">Users</a></li>
      <li><a href="accounts.html?type=Platform%20Manager" data-type="Platform Manager">Platform Managers</a></li>
    </ul>
  </div>
  <div class="sb-group">
    <h3>Requests</h3>
    <ul>
      <li><a href="requests.html?filter=Unresolved">Pending Requests</a></li>
      <li><a href="requests.html?filter=Resolved">Resolved Requests</a></li>
    </ul>
  </div>
</aside>

<main class="app-main" id="appMain">
  <div class="page-head">
    <h1>Accounts</h1>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label for="typeFilter">User Type:</label>
      <select class="input select-compact" id="typeFilter">
        <option value="User Admin">User Admin</option>
        <option value="User">User</option>
        <option value="Platform Manager">Platform Manager</option>
      </select>
    </div>
    <div class="search-box">
      <span class="icon">🔍</span>
      <input class="input" id="searchInput" placeholder="Search user…">
    </div>
  </div>

  <div class="data-table">
    <table>
      <thead>
        <tr>
          <th>User ID</th><th>First Name</th><th>Last Name</th><th>Email</th><th>User Type</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="accountsBody"></tbody>
    </table>
  </div>
  <div id="emptyState" class="empty-hint" style="display:none;">No accounts match your search.</div>
</main>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const initialType = params.get("type") || "User Admin";
  const typeFilter = document.getElementById("typeFilter");
  const searchInput = document.getElementById("searchInput");
  const body = document.getElementById("accountsBody");
  const emptyState = document.getElementById("emptyState");

  typeFilter.value = initialType;

  // highlight matching sidebar link
  document.querySelectorAll('.sb-group a[data-type]').forEach(a=>{
    if(a.dataset.type === initialType) a.classList.add("active");
  });

  function render(){
    const type = typeFilter.value;
    const query = searchInput.value.trim().toLowerCase();
    const rows = ACCOUNTS.filter(a => a.type === type).filter(a => {
      if(!query) return true;
      return [a.id, a.firstName, a.lastName, a.email].join(" ").toLowerCase().includes(query);
    });

    body.innerHTML = "";
    rows.forEach(a => {
      const tr = document.createElement("tr");
      tr.addEventListener("click", () => window.location.href = "view-account.html?id=" + a.id);
      tr.innerHTML = `
        <td class="mono-id">${a.id}</td>
        <td>${a.firstName}</td>
        <td>${a.lastName}</td>
        <td class="email-cell">${a.email}</td>
        <td>${a.type}</td>
        <td><span class="status-dot status-${a.status.toLowerCase()}">${a.status}</span></td>
      `;
      body.appendChild(tr);
    });

    emptyState.style.display = rows.length ? "none" : "block";
  }

  typeFilter.addEventListener("change", render);
  searchInput.addEventListener("input", render);
  render();
</script>
</body>
</html>
